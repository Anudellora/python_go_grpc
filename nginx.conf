worker_processes 1;
pid artifacts/nginx.pid;
error_log artifacts/nginx-error.log info;
events { worker_connections 1024; }
http {
    access_log artifacts/nginx-access.log;
    client_body_temp_path artifacts/client_body;
    proxy_temp_path artifacts/proxy;
    fastcgi_temp_path artifacts/fastcgi;
    uwsgi_temp_path artifacts/uwsgi;
    scgi_temp_path artifacts/scgi;
    upstream grpcservers { server 127.0.0.1:50051; }
    server {
        listen 127.0.0.1:9448 ssl http2;
        server_name localhost;
        ssl_certificate certs/server.pem;
        ssl_certificate_key certs/server-key.pem;
        ssl_client_certificate certs/ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / { grpc_pass grpc://grpcservers; grpc_read_timeout 10s; }
        location = /nginx_status { stub_status on; allow 127.0.0.1; deny all; }
    }
}
