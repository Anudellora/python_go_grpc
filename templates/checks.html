<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Проверки практической №4</title><style>
body{font:15px/1.5 system-ui;background:#f4f5f7;color:#18212c;margin:0}main{max-width:1100px;margin:32px auto;padding:0 24px}h1{font-size:29px;margin-bottom:8px}.sub{color:#566477;font-size:13px;margin-bottom:24px}article{padding:16px 20px;background:white;border:1px solid #dce1e8;border-radius:10px;margin-bottom:12px}.command{font:600 12px/1.5 ui-monospace,monospace;word-break:break-all}.status{float:right;font-size:11px;color:#1e6a4a;margin-left:15px}.bad{color:#b02020}pre{font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#39495c;margin-bottom:0}nav a{margin-right:15px;color:#314ecc;font-size:13px}.label{font-size:11px;font-weight:750;letter-spacing:1px;color:#526176}</style></head><body><main><div class="label">ПРАКТИЧЕСКАЯ РАБОТА 04 · РЕЗУЛЬТАТЫ ПРОВЕРКИ</div><h1>{{ title }}</h1><div class="sub">Фактический вывод команд в Ubuntu 24.04 · {{ captured_at }}</div>{% for row in rows %}<article><span class="status {% if row.exit_code %}bad{% endif %}">Код {{ row.exit_code }}</span><div class="command">$ {{ row.command }}</div><pre>{{ row.output }}</pre></article>{% endfor %}<nav>{% for key,label in groups.items %}<a href="?section={{ key }}">{{ label }}</a>{% endfor %}</nav></main></body></html>
